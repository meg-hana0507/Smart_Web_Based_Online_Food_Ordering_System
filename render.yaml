services:
  - type: web
    name: food-delivery-app
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn food_delivery_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: food-delivery-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: food-delivery-db
    databaseName: food_delivery_db
    user: food_delivery_user
